# iOS edition (ios-app/, Flutter). The Android app is built locally with Gradle.
workflows:
  # ── iOS: build, sign, upload to App Store Connect ──
  ios-release:
    name: iOS Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: ios-app
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: 3.41.2  # pinned so a new "stable" cannot break a build
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.freedomfighter.baristatimer
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Tests
        script: flutter test
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false  # upload only

  # ── iOS: one brew in the simulator, one screenshot per scene ──
  # integration_test/shots_test.dart runs a brew on a clock it controls; each
  # "SHOT:<name>" line it prints is a screenshot here (iPhone 6.9", 1320×2868).
  ios-screenshots:
    name: iPhone screenshots (simulator)
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: ios-app
    environment:
      flutter: 3.41.2
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Brew once and take the screenshots
        script: |
          #!/bin/bash
          set -e -o pipefail
          TYPE=$(xcrun simctl list devicetypes | grep -F "iPhone 16 Pro Max" | head -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
          UDID=$(xcrun simctl create shots "$TYPE")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          sleep 120  # the "Ready for Apple Intelligence" banner shows up ~90 s after boot; let it pass
          mkdir -p screenshots
          flutter drive --driver=test_driver/integration_test.dart \
            --target=integration_test/shots_test.dart -d "$UDID" 2>&1 |
          while IFS= read -r line; do
            echo "$line"
            case "$line" in
              *SHOT:*) name="${line##*SHOT:}"; sleep 1
                       xcrun simctl io "$UDID" screenshot "screenshots/$name.png" ;;
            esac
          done
          xcrun simctl shutdown "$UDID"
          ls -l screenshots/
    artifacts:
      - screenshots/*.png

  # One-off helper: registers the bundle id at Apple and creates its App Store
  # provisioning profile, signed with the distribution certificate Codemagic holds.
  # Then: Settings → Code signing identities → iOS provisioning profiles →
  # Fetch profiles → tick the new one.
  apple-profiles:
    name: "Apple: bundle id and App Store profile"
    max_build_duration: 10
    instance_type: linux_x2
    integrations:
      app_store_connect: codemagic
    environment:
      vars:
        BUNDLE_ID: "com.freedomfighter.baristatimer"
        BUNDLE_NAME: "Timer for 9Barista"
        CERT_ID: "UV32QNP69H"  # "Apple Distribution: Pierre Gallaz", expires 2027-03-02
    scripts:
      - name: Register the bundle id and create the profile
        script: |
          set -e
          lookup() { app-store-connect list-bundle-ids --bundle-id-identifier "$BUNDLE_ID" --platform IOS --strict-match-identifier 2>/dev/null | sed -n 's/^Id: //p' | head -1; }
          BID=$(lookup)
          if [ -z "$BID" ]; then
            app-store-connect create-bundle-id --platform IOS --name "$BUNDLE_NAME" "$BUNDLE_ID"
            BID=$(lookup)
          fi
          echo "$BUNDLE_ID → bundle id resource $BID"
          test -n "$BID"
          app-store-connect create-profile \
            --certificate-ids "$CERT_ID" \
            --type IOS_APP_STORE \
            --name "$BUNDLE_ID app store" \
            "$BID" || echo "(profile not created: it may already exist)"
          echo "=== App Store profiles"; app-store-connect list-profiles --type IOS_APP_STORE || true
